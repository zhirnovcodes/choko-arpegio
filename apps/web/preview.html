<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device preview</title>
    <style>
      body { margin: 0; padding: 24px; background: #f4f4f4; font: 13px system-ui, sans-serif; color: #444; }
      .row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
      figure { margin: 0; }
      figcaption { margin-top: 8px; }
      .device { image-rendering: pixelated; }
      .device svg { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="row">
      <figure><div class="device" id="x1" style="width: 207px; height: 169px"></div><figcaption>1× (207 × 169, plugin size)</figcaption></figure>
      <figure><div class="device" id="x3" style="width: 621px; height: 507px"></div><figcaption>3×</figcaption></figure>
    </div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
